# Lint, type-check, test and build the API and the web app, then deploy the API to
# Fly.io from main (needs the FLY_API_TOKEN repository secret).
# Runs on every push (any branch), every pull request, merge-queue merges, and on demand.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress, except on main,
# where every commit gets a full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Same major version as the backend Dockerfile (node:24-alpine).
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend · format, lint, build, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: Lint (oxlint, type-aware)
        run: npm run lint
      - name: Build (type-checks with tsc)
        run: npm run build
      - name: Unit tests
        run: npm test

  backend-e2e:
    name: Backend · e2e (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # Matches docker-compose.yml; vitest.config.e2e.ts connects to localhost:5433 and
    # creates the savemyvote_test database itself.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: savemyvote
          POSTGRES_PASSWORD: savemyvote
          POSTGRES_DB: savemyvote
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U savemyvote -d savemyvote"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: E2E tests
        run: npm run test:e2e

  backend-docker:
    name: Backend · Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    name: Frontend · lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      # tsc -b, then vite build. Without SENTRY_AUTH_TOKEN the Sentry plugin is off,
      # so no release is created and no source maps are uploaded from CI.
      - name: Build
        run: npm run build

  # Deploys the API to Fly.io (backend/fly.toml) once every backend job has passed on
  # main. The frontend deploys itself through Vercel's Git integration.
  # Runs on pushes to main that change backend/, or on a manual run from main.
  deploy-api:
    name: Deploy API to Fly.io
    needs: [backend, backend-e2e, backend-docker]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time; a newer one waits instead of cancelling a deploy mid-way.
    concurrency:
      group: fly-deploy-api
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the diff below covers every commit in the push.
          fetch-depth: 0
      - name: Did backend/ change?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- .; then
            echo "No changes under backend/ in this push; skipping the deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      # superfly/flyctl-actions 1.6, pinned by commit.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        if: steps.changes.outputs.deploy == 'true'
      # --ha=false keeps exactly one machine (startup migrations, in-memory rate limits).
      # Fly's builder builds the image; the run fails if the new machine's /api/health
      # check doesn't pass, and the old machine keeps serving (blue-green).
      - name: fly deploy
        if: steps.changes.outputs.deploy == 'true'
        run: flyctl deploy --remote-only --ha=false --env "SENTRY_RELEASE=$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
