# Fly.io config for the SaveMyVote API. Deploy from this folder:  fly deploy --ha=false
# Run exactly one machine: migrations run on startup (no cross-instance lock) and the
# rate limiter keeps its counts in memory. The every-minute invitation cron needs the
# machine to stay up, so auto-stop is off.
# Secrets are set with `fly secrets set`, never here:
#   DATABASE_URL, JWT_ACCESS_SECRET, JWT_EMAIL_SECRET, OTP_SECRET, SENDBYTE_API_KEY,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SENTRY_DSN, R2_ACCESS_KEY_ID,
#   R2_SECRET_ACCESS_KEY, USERJOT_PROJECT_SECRET.
# The app refuses to start in production without the R2 settings.

app = "savemyvote-api"
primary_region = "lhr"
# Nest closes the DB pool and lets the running cron sweep finish on SIGTERM.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Start the new machine, wait for /api/health, then retire the old one.
  strategy = "bluegreen"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Fly's proxy is the one hop in front of the app; needed for correct client IPs in rate limiting.
  TRUST_PROXY = "true"
  FRONTEND_URL = "https://savemyvote.mblob.me"
  BACKEND_URL = "https://api.savemyvote.mblob.me"
  COOKIE_SAME_SITE = "lax"
  # Neon requires TLS. Use its direct (non "-pooler") connection string: the scheduler's
  # session advisory lock does not work through PgBouncer in transaction mode.
  DB_SSL = "true"
  DB_RUN_MIGRATIONS = "true"
  MAIL_FROM_ADDRESS = "no-reply@savemyvote.mblob.me"
  MAIL_FROM_NAME = "SaveMyVote"
  # Cloudflare R2 bucket for candidate photos and logos (keys: R2_ACCESS_KEY_ID and
  # R2_SECRET_ACCESS_KEY secrets). The public URL is the bucket's rate-limited r2.dev
  # address; swap in a custom domain once mblob.me's DNS is on Cloudflare.
  R2_ACCOUNT_ID = "397c640d9287a65697f6f55a274c8252"
  R2_BUCKET = "savemyvote-images"
  R2_PUBLIC_URL = "https://pub-1848db2d30de44b9a7aa6626dd1e72fd.r2.dev"
  SENTRY_ENVIRONMENT = "production"
  # UserJot project for signed feedback identities (needs the USERJOT_PROJECT_SECRET secret:
  # the app refuses to start with only one of the two).
  USERJOT_PROJECT_ID = "cmwsfmj3201rt0kqngoyfgcqd"
  SCHEDULER_ENABLED = "true"
  LOG_LEVEL = "info"
  SWAGGER_ENABLED = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    # Boot (Sentry, Nest, migrations, the Neon connection) takes about 25 s.
    grace_period = "40s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
